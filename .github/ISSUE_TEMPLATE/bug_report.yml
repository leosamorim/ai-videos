name: Bug report
description: Report a reproducible engine defect using synthetic media
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Do not include client media, transcripts, credentials or personal paths.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Commands, synthetic input and relevant error excerpt.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Environment
      description: OS, Node, FFmpeg, HyperFrames and repository version.
    validations:
      required: true
