name: Engine checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      render:
        description: Run the HyperFrames render smoke test
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HYPERFRAMES_SKIP_SKILLS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: npm ci
      - run: npm run validate
      - run: npm run release:export
      - name: Test the public distribution without private assets
        working-directory: dist/github-ready
        run: |
          npm ci
          npm run validate
      - name: HyperFrames render smoke
        if: github.event_name == 'workflow_dispatch' && inputs.render
        run: npm run test:render
